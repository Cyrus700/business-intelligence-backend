# Production compose for a single EC2 instance.
# Postgres lives in Supabase; only the API container runs here.
# Usage:  docker compose -f deploy/docker-compose.prod.yml up -d
# Env:    never commit .env — it is mounted via env_file and gitignored.

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bi-backend:latest
    restart: unless-stopped
    env_file:
      - ../.env          # DATABASE_URL, SUPABASE_*, AWS_*, SMTP_* — never committed
    environment:
      # Force prod hardening regardless of what .env says if this file is used
      ENV: prod
    ports:
      - "127.0.0.1:8000:8000"  # exposed only to nginx on the same host (no public port)
    volumes:
      - uploads:/app/var/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "env"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

volumes:
  uploads:
    driver: local
