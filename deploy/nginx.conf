# Production nginx reverse proxy — TLS via `certbot --nginx`.
# Harden per Mozilla Intermediate profile + OWASP secure headers.

# Redirect all HTTP to HTTPS (certbot will manage certificates)
server {
    listen 80;
    server_name api.example.com;  # ← replace with the real domain
    return 301 https://$host$request_uri;
}

# HTTPS vhost
server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ── TLS (certbot-managed) ──────────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/api.example.com/chain.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "0" always;  # disable legacy XSS auditor, CSP does the work
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # ── Timeouts & limits ──────────────────────────────────────────
    client_max_body_size 25m;          # CSV/XLSX uploads (MAX_UPLOAD_BYTES=50m but nginx caps at 25m for DoS)
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 65s;

    # ── Proxy ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;  # if nginx request_id module enabled

        proxy_read_timeout 120s;   # report generation + admin retrain
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;

        # Do not pass server version
        proxy_hide_header X-Powered-By;
        server_tokens off;

        # Rate limit (fallback to app-level limiter; nginx limit_req would be layered here)
        # limit_req zone=api burst=20 nodelay;
    }

    # ── Health (no auth) — allow LB to probe without TLS client cert ─
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ── Deny hidden files ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
