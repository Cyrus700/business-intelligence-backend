[project]
name = "business-intelligence-backend"
version = "0.1.0"
description = "API backend for the AI-Driven Cloud-Based Business Intelligence and Decision Support Dashboard (FYP, Sairash Budhathoki NP069813)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "boto3>=1.34",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "greenlet>=3.0",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "prophet>=1.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "psycopg[binary]>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# env vars must be set before app modules are imported
"tests/conftest.py" = ["E402"]
# CSV fixture literals read better unwrapped
"tests/integration/test_analytics.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true

# These modules return plain dicts that FastAPI's response_model validates and
# coerces at runtime (idiomatic FastAPI), and build dynamic SQLAlchemy
# expressions that mypy's stubs over-narrow. Runtime correctness is covered by
# the integration test suite's exact-value assertions.
[[tool.mypy.overrides]]
module = ["app.services.analytics.queries", "app.api.v1.analytics"]
disable_error_code = ["arg-type", "return-value", "call-overload", "assignment", "attr-defined", "list-item", "index"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
