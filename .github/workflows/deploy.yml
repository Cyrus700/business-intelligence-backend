name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# Free-tier: cancel outdated, keep latest
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bi-backend

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Free disk space (GH runner, 14GB → 30GB)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker system prune -af --volumes 2>&1 | tail -5 || true
          sudo apt-get clean 2>/dev/null || true
          df -h
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set OWNER_LC
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check . || echo "ruff warnings"

      - name: Type check
        run: uv run mypy app || echo "mypy warnings"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (free public)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend (GHCR + gha cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/bi-backend:${{ github.sha }},ghcr.io/${{ env.OWNER_LC }}/bi-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-backend:
    needs: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}" || (echo "::error::EC2_HOST missing — set in Settings → Secrets → Actions" && exit 1)
          test -n "${{ secrets.EC2_USER }}" || (echo "::error::EC2_USER missing" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "::error::EC2_SSH_KEY missing" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "echo ok && free -h && docker --version"

      - name: Rsync backend to EC2 (no .env, no venv)
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.pytest_cache' --exclude 'var/' --exclude '.env' --exclude 'pgdata/' \
            -e "ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/business-intelligence-backend/"

      - name: Deploy backend on EC2 (pull GHCR, not build on 1GB)
        env:
          TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<EOSSH
          set -euo pipefail
          cd ~/app
          # Ensure compose exists (monorepo or backend-only)
          if [ -f deploy/docker-compose.prod.yml ]; then COMPOSE="deploy/docker-compose.prod.yml"; else COMPOSE="business-intelligence-backend/deploy/docker-compose.prod.yml"; fi
          echo "Using \$COMPOSE owner $OWNER_LC"
          # Free-tier: 2GB swap already created by ec2-init.sh
          free -h
          # Ensure .env exists
          if [ ! -f business-intelligence-backend/.env ]; then
            echo "ERROR: business-intelligence-backend/.env missing — create from .env.example"
            exit 1
          fi
          # --- fix stale prod .env left from pre-domain infra ---
          if grep -q "SUPABASE_JWT_SECRET" business-intelligence-backend/.env 2>/dev/null; then
            echo "→ migrate SUPABASE_JWT_SECRET → JWT_SECRET in .env"
            sed -i "s/^SUPABASE_JWT_SECRET=/JWT_SECRET=/" business-intelligence-backend/.env || true
          fi
          if grep -q "FRONTEND_ORIGINS=http://localhost" business-intelligence-backend/.env 2>/dev/null; then
            echo "→ patch FRONTEND_ORIGINS to prod domains"
            sed -i "s|^FRONTEND_ORIGINS=.*|FRONTEND_ORIGINS=https://www.insightflowai.tech,https://insightflowai.tech,https://api.insightflowai.tech|" business-intelligence-backend/.env || true
          fi
          if grep -q "GOOGLE_REDIRECT_URI=http://localhost" business-intelligence-backend/.env 2>/dev/null; then
            echo "→ patch GOOGLE_REDIRECT_URI to prod"
            sed -i "s|^GOOGLE_REDIRECT_URI=.*|GOOGLE_REDIRECT_URI=https://api.insightflowai.tech/api/v1/auth/google/callback|" business-intelligence-backend/.env || true
          fi
          # rate_limit_per_minute default moved 240→600 in code (dashboard fans out
          # 25+ parallel GETs on first paint); the persistent EC2 .env predates that
          # and silently overrides the new default, so it needs patching explicitly.
          if grep -q "^RATE_LIMIT_PER_MINUTE=240" business-intelligence-backend/.env 2>/dev/null; then
            echo "→ bump stale RATE_LIMIT_PER_MINUTE 240 → 600"
            sed -i "s/^RATE_LIMIT_PER_MINUTE=240/RATE_LIMIT_PER_MINUTE=600/" business-intelligence-backend/.env || true
          fi
          cat business-intelligence-backend/.env | grep -E "FRONTEND_ORIGINS|GOOGLE_REDIRECT|JWT_SECRET" | sed "s/JWT_SECRET=.*/JWT_SECRET=***/" || true
          # Pull GHCR (public) — no build on 1GB
          export TAG=$TAG
          export OWNER_LC=$OWNER_LC
          # --- free-tier disk guard: EC2 is 30GB, image layers ~2GB each, so prune BEFORE pull ---
          echo "→ pre-pull disk free (30GB guard)"
          df -h || true
          docker system df || true
          # keep only the running images, drop everything else
          docker image prune -af 2>&1 | tail -20 || true
          docker builder prune -af 2>&1 | tail -20 || true
          docker container prune -f 2>&1 | tail -5 || true
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5 || sudo journalctl --vacuum-time=1d 2>&1 | tail -5 || true
          sudo rm -rf /tmp/* /var/tmp/* 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          # containerd overlayfs snapshot leftovers (the exact path from the error)
          sudo rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/new-* 2>/dev/null || true
          df -h || true
          # Update compose image tag (lowercase)
          sed -i "s|image: .*bi-backend:.*|image: ghcr.io/$OWNER_LC/bi-backend:$TAG|" \$COMPOSE || true
          if grep -q "ghcr.io" \$COMPOSE; then
            if [ -f ~/ghcr.token ]; then cat ~/ghcr.token | docker login ghcr.io -u $OWNER_LC --password-stdin || true; fi
            docker compose -f \$COMPOSE pull api 2>&1 | tail -100 || docker pull ghcr.io/$OWNER_LC/bi-backend:$TAG 2>&1 | tail -100
          else
            docker compose -f \$COMPOSE build api
          fi
          echo "→ migrate"
          docker compose -f \$COMPOSE run --rm api alembic upgrade heads 2>&1 | tail -50 || docker compose -f \$COMPOSE run --rm api python -m alembic upgrade heads 2>&1 | tail -50
          echo "→ up -d"
          docker compose -f \$COMPOSE up -d api
          sleep 5
          curl -fsS http://127.0.0.1:8000/api/v1/health | head -c 200; echo " — backend ok"
          docker compose -f \$COMPOSE ps
          # Free-tier disk 30GB prune (post-deploy, keep recent)
          docker image prune -f --filter "until=12h" 2>&1 | tail -10 || true
          docker builder prune -f --filter "until=24h" 2>&1 | tail -10 || true
          df -h | head -n 10 || true
          docker system df || true
          EOSSH

      - name: Smoke via nginx
        run: |
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "curl -fsS http://127.0.0.1:80/api/v1/health | head -c 200 && echo ' — nginx→api ok'"
