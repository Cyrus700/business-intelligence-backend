name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests run locally (they need a seeded warehouse to be meaningful); CI keeps
  # the fast static gates + the image build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bi-backend:ci .
